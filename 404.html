<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | HORIZON X 2K26</title>
  <link rel="icon" type="image/png" href="assets/brand/horizon-x-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #F8FAFC;
      color: #0F172A;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }
    .container {
      position: relative;
      z-index: 10;
      max-width: 520px;
      width: 100%;
      text-align: center;
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 20px;
      padding: 48px 36px;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.06), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
    }
    .badge {
      display: inline-block;
      padding: 5px 14px;
      border-radius: 9999px;
      background: #EFF6FF;
      border: 1px solid #DBEAFE;
      color: #2563EB;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 20px;
    }
    .error-code {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 96px;
      font-weight: 800;
      line-height: 1;
      color: #2563EB;
      margin-bottom: 16px;
      letter-spacing: -3px;
    }
    h1 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 12px;
      color: #172554;
      letter-spacing: -0.02em;
    }
    p {
      color: #64748B;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #2563EB;
      color: #FFFFFF;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 600;
      font-size: 14px;
      padding: 12px 24px;
      border-radius: 10px;
      text-decoration: none;
      transition: all 0.2s ease;
      box-shadow: 0 1px 3px rgba(37, 99, 235, 0.3);
    }
    .btn-primary:hover {
      background: #1E40AF;
      transform: translateY(-1px);
      box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.35);
    }
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      color: #0F172A;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 600;
      font-size: 14px;
      padding: 12px 24px;
      border-radius: 10px;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn-secondary:hover {
      background: #F8FAFC;
      border-color: #CBD5E1;
      color: #2563EB;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">HORIZON X 2K26</div>
    <div class="error-code">404</div>
    <h1>Page Not Found</h1>
    <p>The coordinate or link you requested does not exist on our platform or may have been relocated.</p>
    <div class="actions">
      <a href="index.html" class="btn-primary">
        <span>← Return to Homepage</span>
      </a>
      <a href="control.html" class="btn-secondary">
        <span>Admin Dashboard</span>
      </a>
    </div>
  </div>
</body>
</html>
